# GitLab CI/CD Pipeline for ThreatLens CTI Platform
# Operating on STIX 2.1, TAXII, and MITRE ATT&CK standards

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: threatlens_test
  POSTGRES_USER: threatlens
  POSTGRES_PASSWORD: threatlens_secure_password
  POSTGRES_HOST_AUTH_METHOD: trust

# Cache build caches across jobs (excluding dirty node_modules)
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - frontend/.next/cache

# =========================================================
# STAGE 1: LINT
# =========================================================

lint:python:
  stage: lint
  image: python:3.11-slim
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install ruff
  script:
    - cd backend
    - ruff check app tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm install --prefer-offline --no-audit
  script:
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# =========================================================
# STAGE 2: TEST
# =========================================================

test:backend:
  stage: test
  image: python:3.11-slim
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: "sqlite:///./test_threatlens.db"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "ci-testing-secret-key-threatlens-2026"
    ENVIRONMENT: "test"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential curl
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest-cov
  script:
    - pytest --cov=app --cov-report=term-missing tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    paths:
      - backend/coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# =========================================================
# STAGE 3: BUILD
# =========================================================

build:frontend:
  stage: build
  image: node:20-alpine
  variables:
    NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"
  before_script:
    - cd frontend
    - npm install --prefer-offline --no-audit
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/.next/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:docker-images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
  script:
    - docker build -t threatlens-backend:ci ./backend
    - docker build -t threatlens-frontend:ci ./frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
